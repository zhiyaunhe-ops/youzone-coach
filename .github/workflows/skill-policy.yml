name: Skill policy

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  skill-policy:
    name: Skill policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install YAML parser
        run: python -m pip install PyYAML==6.0.3
      - name: Check the skill policy checker
        run: python -m unittest discover -s tests -p 'test_skill_policy.py'
      - name: Validate skill entrypoints and reference routes
        run: python scripts/check-skill-policy.py --config .skill-policy.json
